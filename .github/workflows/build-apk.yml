name: Build APK

# Se lance automatiquement à chaque envoi sur la branche main,
# et peut aussi être lancé manuellement depuis l'onglet "Actions" sur GitHub.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer les dépendances
        run: npm install

      - name: Construire le site web (Vite)
        run: npm run build

      - name: Synchroniser Capacitor → Android
        run: npx cap sync android

      - name: Construire l'APK (debug, installable directement)
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Publier l'APK comme fichier téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: gestion-ferme-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
